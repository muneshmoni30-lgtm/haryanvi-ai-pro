<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Haryanvi AI Studio Pro</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080b;
      --card-bg: #111318;
      --card-border: #1d212b;
      --card-neon: rgba(255, 118, 46, 0.35);
      --primary: #FF762E;
      --primary-hover: #ff5e0a;
      --primary-gradient: linear-gradient(135deg, #FF762E 0%, #FF3D00 100%);
      --text-main: #FFFFFF;
      --text-sub: #7D8597;
      --success: #00E676;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .glow-orb-1, .glow-orb-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      animation: floatOrbs 14s infinite alternate ease-in-out;
    }
    .glow-orb-1 {
      width: 280px;
      height: 280px;
      background: #FF762E;
      top: -60px;
      left: -60px;
    }
    .glow-orb-2 {
      width: 320px;
      height: 320px;
      background: #FF3D00;
      bottom: 80px;
      right: -70px;
      animation-duration: 18s;
    }
    @keyframes floatOrbs {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 80px) scale(1.15); }
    }

    .top-nav {
      position: sticky;
      top: 0;
      background: rgba(7, 8, 11, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 118, 46, 0.15);
      z-index: 40;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-wrap span { color: var(--primary); }
    .logo-pulse {
      width: 28px;
      height: 28px;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #FF762E); transform: scale(1); }
      50% { filter: drop-shadow(0 0 10px #FF762E); transform: scale(1.08); }
    }
    .tag-pro {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--primary);
      background: rgba(255, 118, 46, 0.12);
      border: 1px solid rgba(255, 118, 46, 0.35);
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(255, 118, 46, 0.15);
    }

    .container {
      position: relative;
      z-index: 10;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-head h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 40%, #b0b8c4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .page-head p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card-neon {
      border: 1px solid var(--card-neon);
      box-shadow: 0 0 18px rgba(255, 118, 46, 0.08);
    }
    .card-neon:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 22px rgba(255, 118, 46, 0.25);
    }

    .tabs-wrap {
      display: flex;
      background: #090a0d;
      border: 1px solid #1c202a;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .pill-btn {
      flex: 1;
      padding: 9px 8px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn.active {
      background: #1c202c;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .selectors-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .select-item {
      background: #0b0c10;
      border: 1px solid #1b1e27;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .select-label {
      font-size: 0.68rem;
      color: var(--text-sub);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .select-item select {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
      width: 100%;
    }

    .input-box-wrap {
      background: #090a0d;
      border: 1px solid #1a1d26;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-box-wrap textarea {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      width: 100%;
      min-height: 75px;
      line-height: 1.45;
    }
    .input-box-wrap textarea::placeholder {
      color: #484f60;
    }
    .input-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #13161f;
      padding-top: 8px;
    }
    .char-count {
      font-size: 0.72rem;
      color: var(--text-sub);
    }
    .mic-inline-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .waveform-panel {
      background: #090a0d;
      border: 1px solid #171a24;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wave-header {

      justify-content: space-between;
